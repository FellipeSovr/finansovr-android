<style>
body{margin:0}
.vp{--bg:#071430;--bg0:rgba(7,20,48,0);--tx:#F2F6FF;--t2:#C9D5F2;--t3:#B9C6E6;--t4:#8E9CC0;--ok:#BFF5DA;--bad:#FFB3CF;--link:#9FDBFF;--li:#DCD3FF;--ln:rgba(255,255,255,.12);transition:background .4s}
.vp.claro{--bg:#EAF0FA;--bg0:rgba(234,240,250,0);--tx:#0E1F45;--t2:#3E4E75;--t3:#56658A;--t4:#6E7CA0;--ok:#11865A;--bad:#C2366B;--link:#1767B5;--li:#5A3FC0;--ln:rgba(14,31,69,.12)}
a{color:var(--link)}a:hover{color:var(--tx)}
.vp button{font-family:inherit;color:inherit}
.vp button:focus-visible,.vp input:focus-visible{outline:2px solid #8FE6FF;outline-offset:2px}
.blur{background:linear-gradient(140deg,rgba(255,255,255,.17),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.06),0 14px 34px rgba(0,4,30,.38);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
.gl{background:linear-gradient(140deg,rgba(255,255,255,.14),rgba(255,255,255,.045));border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 8px 22px rgba(0,4,30,.28)}
.leve .blur{-webkit-backdrop-filter:none;backdrop-filter:none;background:linear-gradient(140deg,#1F3269,#142553)}
.leve .sheet.blur{background:linear-gradient(180deg,#1C2E62,#111F47)}
.press{transition:transform .18s cubic-bezier(.3,1.4,.5,1)}
.press:active{transform:scale(.95)}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:78px 0 124px;box-sizing:border-box;scrollbar-width:none;user-select:none;-webkit-user-select:none}
.scroll::-webkit-scrollbar{display:none}
.pw{will-change:transform}
.pw.settle{transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.in-r{animation:inR .42s cubic-bezier(.2,.9,.3,1) both}
.in-l{animation:inL .42s cubic-bezier(.2,.9,.3,1) both}
@keyframes inR{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
.fade{animation:fade .35s ease both}
.sk{display:block;background:rgba(255,255,255,.09);border-radius:9px;position:relative;overflow:hidden}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);animation:shim 1.3s ease-in-out infinite}
@keyframes shim{to{transform:translateX(100%)}}
.out-r{animation:outR .24s cubic-bezier(.5,0,.8,.4) both}
@keyframes outR{to{opacity:0;transform:translateX(26px)}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ic{display:inline-grid;place-items:center;flex:0 0 auto;color:color-mix(in srgb,var(--c) 45%,#fff);background:linear-gradient(150deg,color-mix(in srgb,var(--c) 46%,transparent),color-mix(in srgb,var(--c) 12%,transparent));border:1px solid color-mix(in srgb,var(--c) 40%,rgba(255,255,255,.3));box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.hb{height:44px;min-width:44px;padding:0 12px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:800;font-size:15px;cursor:pointer}
.chip{height:40px;padding:0 14px 0 5px;border-radius:20px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;flex:0 0 auto}
.chip.t{padding:0 14px}
.chip.on{background:rgba(255,255,255,.9);color:#071430;border-color:transparent}
.sec{font-size:15px;font-weight:700;margin:0}
.mut{color:var(--t3)}
.hero-n{font-size:60px;font-weight:800;letter-spacing:-0.045em;line-height:1.05;margin:6px 0 14px;font-variant-numeric:tabular-nums}
.hero-n.neg{color:var(--bad)}
.st{font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px;transition:background .3s,color .3s}
.st.ok{color:var(--ok);background:rgba(95,224,176,.18);border:1px solid rgba(95,224,176,.35)}
.st.bad{color:var(--bad);background:rgba(255,111,159,.2);border:1px solid rgba(255,143,182,.4)}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#8FE6FF,#3AA7F0);transform-origin:left;transition:transform .7s cubic-bezier(.2,.9,.3,1)}
.bar.neg i{background:linear-gradient(90deg,#FFB3CF,#FF6F9F)}
.tile{border-radius:22px;padding:12px 16px}
.tile .k{font-size:12px;color:var(--t2)}
.tile .v{font-size:20px;font-weight:800;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.tube{width:22px;height:70px;border-radius:7px;position:relative;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid var(--ln);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.tube i{position:absolute;left:0;right:0;bottom:0;border-radius:6px;background:linear-gradient(180deg,#8FE6FF,#3AA7F0);transform-origin:bottom;animation:fillUp .9s cubic-bezier(.25,1.25,.4,1) both;transition:height .5s cubic-bezier(.2,.9,.3,1)}
.tube.over i{background:linear-gradient(180deg,#FFB3CF,#FF6F9F)}
.tube.plan i{background:repeating-linear-gradient(135deg,rgba(255,200,92,.85) 0 4px,rgba(255,200,92,.45) 4px 8px)}
.tube.hoje{border-color:rgba(255,255,255,.65)}
.tube.fut{opacity:.5}
.tube.big{width:30px;height:96px;border-radius:9px}
.tube.big i{border-radius:8px}
@keyframes fillUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.dsel{border-radius:18px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--t3);cursor:pointer;border:1px solid transparent;background:none;transition:background .25s,border-color .25s}
.dsel.on{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:var(--tx);font-weight:700}
.dA{animation:detA .35s cubic-bezier(.2,.9,.3,1) both}.dB{animation:detB .35s cubic-bezier(.2,.9,.3,1) both}
@keyframes detA{from{opacity:.2;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}

// ------------------------------------------------ v7.2.0: velocidade e robustez
// Gasto novo, edição, exclusão, duplicar e desfazer passam por gasto(): o item aparece na lista na hora ("enviando…"),
// o envio leva uma etiqueta única (reenviar não duplica) e a resposta já traz o Painel e o item como ficaram na planilha.
// Planilha ocupada: o app espera e tenta de novo a cada minuto. Erros vão para a aba "Erros" da planilha.

// ---------- cópias locais de outro formato são descartadas (dados) — preferências, conexão e filtros ficam
const FMT_LOCAL = '72';
(function () {
  try {
    if (localStorage.getItem(CV + 'fmt') === FMT_LOCAL) return;
    Object.keys(localStorage).forEach(k => {
      if (k.indexOf(CV) !== 0) return;
      const n = k.slice(CV.length);
      if (/^(tudo|tok|lista|pend|venc|sim|orc|ana|rendas|ajustes|glo|cat|rel|arq|mov:|cal:|reemb:|rev:)/.test(n)) localStorage.removeItem(k);
    });
    localStorage.setItem(CV + 'fmt', FMT_LOCAL);
  } catch (e) {}
})();

// ---------- chamada com opções: etiqueta, extras (item, painel) e resposta completa
const dormir = (ms) => new Promise(r => setTimeout(r, ms));
const novaEtq = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function chamarX(fn, args, op) {
  if (typeof NAT !== 'undefined' && NAT.app) return chamarApi(fn, args, op);
  return Servidor.chamar(fn, args).then(r => ({ r }));          // tela web: sem extras (o app atualiza depois, como antes)
}
const RAP = { tirando: {}, esp: 0, avisou: 0, ultEscrita: 0, tempos: null, salvar: null, espera: 60000 };
async function enviar(fn, args, extra, linhaLocal) {
  const etq = novaEtq(); let tent = 0;
  for (;;) {
    const t0 = Date.now();
    try {
      const env = await chamarX(fn, args, { etq, extra, tent });
      RAP.ultEscrita = Date.now();
      RAP.salvar = { fn, total: Date.now() - t0, servidor: env.ms != null ? env.ms : null, tempos: env.tempos || null, quando: Date.now() };
      if (tent && RAP.esp) { RAP.esp--; set(); }
      return env;
    } catch (e) {
      tent++;
      if (e && e.ocupada && tent <= 15) {                         // uma importação ou rotina está gravando: tenta de novo em 1 min
        if (tent === 1) { RAP.esp++; if (Date.now() - RAP.avisou > 30000) { RAP.avisou = Date.now(); toast('Planilha ocupada: tento de novo a cada minuto'); } }
        if (linhaLocal) marcarLocal(linhaLocal, { pend: 'esp' }); set();
        await dormir(RAP.espera);
        if (linhaLocal) marcarLocal(linhaLocal, { pend: 'env' }); set();
        continue;
      }
      if (tent > 1 && RAP.esp && (!e || !e.ocupada)) { RAP.esp--; set(); }
      if (e && e.tempo && tent <= 2) { await dormir(2500); continue; }   // não respondeu: reenvia (a etiqueta evita duplicar)
      throw e;
    }
  }
}

function pullStart(y, x) { if (S.refreshing || S.sheet || M.scroll.scrollTop > 0) { PL.on = false; return; } Object.assign(PL, { on: true, y0: y, x0: x, act: false, pull: 0 }); }
function pullMove(y, x, e) {
  if (!PL.on) return;
  const dy = y - PL.y0, dx = x - PL.x0;
  if (!PL.act) { if (dy < 6) { if (dy < -6) PL.on = false; return; } if (Math.abs(dx) > dy || SW.act) { PL.on = false; return; } PL.act = true; M.pw.classList.remove('settle'); }
  PL.pull = Math.min(120, Math.max(0, dy * 0.5));
  pintaPull(PL.pull, false);
  if (e && e.cancelable) e.preventDefault();
}
function pintaPull(p, gira) {
  M.pw.style.transform = 'translateY(' + p.toFixed(1) + 'px)';
  M.ind.style.opacity = Math.min(1, p / 46).toFixed(2);
  M.ind.style.transform = 'translateY(' + (p * 0.55).toFixed(1) + 'px) rotate(' + (gira ? 0 : Math.round(p * 3)) + 'deg)';
  M.ind.classList.toggle('ready', p >= 64 || !!gira); M.ind.classList.toggle('spin', !!gira);
}
async function pullEnd() {
  if (!PL.on) return; PL.on = false; if (!PL.act) return;
  M.pw.classList.add('settle');
  if (PL.pull < 64) { pintaPull(0, false); return; }
  vib(12); S.refreshing = true; pintaPull(60, true);
  try { invalidar('lista', 'pend', 'venc', 'sim', 'orc', 'ana', 'rendas', 'rel', 'ajustes', 'glo', 'cat'); invalidarMov(); if (REV) invalidar('rev:' + REV.mes); await sincronizar(true); recarregarAberto(); if (S.tab === 'painel') animHeroDe(0); toast(RAP.tempos && RAP.tempos.igual ? 'Tudo em dia: nada mudou na planilha' : 'Dados atualizados'); preCarregarMais(true); }
  finally { S.refreshing = false; pintaPull(0, false); set(); }
}

// ---------- montagem e eventos
function iniciar() {
  M.vp = document.getElementById('vp'); M.scroll = document.getElementById('scroller'); M.pw = document.getElementById('pw'); M.ind = document.getElementById('indp');
  M.tab = document.getElementById('m-tab'); M.hd = document.getElementById('m-hd'); M.toast = document.getElementById('m-toast'); M.fan = document.getElementById('m-fan'); M.nav = document.getElementById('m-nav'); M.sheet = document.getElementById('m-sheet'); M.con = document.getElementById('m-con');
  M.vp.classList.toggle('claro', temaEf() === 'claro');
  S.VW = M.vp.clientWidth || 390; S.W = Math.max(240, S.VW - 64);
  // topo compacto ao rolar
  M.scroll.addEventListener('scroll', () => { const c = M.scroll.scrollTop > 44; if (c !== S.cmp) set({ cmp: c }); }, { passive: true });
  // itens deslizáveis e "segure para ver"
  M.vp.addEventListener('pointerdown', (e) => { swDown(e); peekDown(e); });
  M.vp.addEventListener('pointermove', (e) => { swMove(e); peekMove(e); });
  M.vp.addEventListener('pointerup', (e) => { swUp(e); peekUp(); });
  M.vp.addEventListener('pointercancel', (e) => { swUp(e); peekUp(); });
  M.vp.addEventListener('click', (e) => { if (SW.blockClick) { e.stopPropagation(); e.preventDefault(); } }, true);
  // puxar para atualizar
  M.scroll.addEventListener('touchstart', (e) => { const t = e.touches[0]; pullStart(t.clientY, t.clientX); }, { passive: true });
  M.scroll.addEventListener('touchmove', (e) => { const t = e.touches[0]; pullMove(t.clientY, t.clientX, e); }, { passive: false });
  M.scroll.addEventListener('touchend', pullEnd);
  M.scroll.addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse' && !e.target.closest('input,button,[data-sw],.chart')) pullStart(e.clientY, e.clientX); });
  M.scroll.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') pullMove(e.clientY, e.clientX, null); });
  M.scroll.addEventListener('pointerup', (e) => { if (e.pointerType === 'mouse') pullEnd(); });
  // arrastar a janela para baixo
  M.sheet.addEventListener('touchstart', (e) => { if (!e.target.closest('#sheetEl')) return; const t = e.touches[0]; sheetDown(t.clientY, t.clientX, e.target); }, { passive: true });
  M.sheet.addEventListener('touchmove', (e) => { const t = e.touches[0]; sheetMove(t.clientY, t.clientX, e); }, { passive: false });
  M.sheet.addEventListener('touchend', sheetUp); M.sheet.addEventListener('touchcancel', sheetUp);
  M.sheet.addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse' && e.target.closest('#sheetEl') && !e.target.closest('input,button')) sheetDown(e.clientY, e.clientX, e.target); });
  window.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' && SD.on) sheetMove(e.clientY, e.clientX, null); });
  window.addEventListener('pointerup', (e) => { if (e.pointerType === 'mouse') sheetUp(); });
  // voltar deslizando da borda esquerda
  let x0 = -1, y0 = 0;
  M.vp.addEventListener('touchstart', (e) => { if (NAT.app) return; const t = e.touches[0], r = M.vp.getBoundingClientRect(); x0 = t.clientX - r.left < 26 ? t.clientX : -1; y0 = t.clientY; }, { passive: true });
  M.vp.addEventListener('touchend', (e) => { if (x0 < 0) return; const t = e.changedTouches[0], dx = t.clientX - x0, dy = Math.abs(t.clientY - y0); x0 = -1; if (dx < 80 || dy > 60 || S.sheet) return; if (S.tab === 'mais' && S.sub) voltarSub(); }, { passive: true });
  // Enter ou espaço em itens que não são <button> (role="button") funcionam como toque
  document.addEventListener('keydown', (e) => { const t = e.target; if ((e.key === 'Enter' || e.key === ' ') && t && t.getAttribute && t.getAttribute('role') === 'button' && t.tagName !== 'BUTTON') { e.preventDefault(); t.click(); } });
  document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if (S.fan) fecharFan(); else if (S.sheet) fecharSheet(); else if (S.sub) voltarSub(); });
  window.addEventListener('resize', medir);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { S.pillX = null; posPill(); });
  if (mqClaro) { const f = () => { if (temaPref() === 'auto') { aplicarTema(); reportarTema(); } }; if (mqClaro.addEventListener) mqClaro.addEventListener('change', f); else if (mqClaro.addListener) mqClaro.addListener(f); }
  render();
  setTimeout(reportarTema, 5000);
  window.__fzIniciou = true;
  if (natIniciar()) recarregar();
}

iniciar();
</script>
